name: Android source compile

on:
  push:
    branches: [codex/refactor-mobile-ui, codex/stage2-robustness]
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx cap sync android
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Compile Android sources only
        run: |
          chmod +x android/gradlew
          android/gradlew -p android --no-daemon --max-workers=2 testDebugUnitTest compileDebugKotlin compileDebugJavaWithJavac compileDebugAndroidTestKotlin compileDebugAndroidTestJavaWithJavac
      - name: Run instrumented Room tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: Nexus 5
          emulator-options: -no-window -no-audio -no-boot-anim
          disable-animations: true
          script: android/gradlew -p android --no-daemon --max-workers=2 connectedDebugAndroidTest
