name: Android SMS Massa Debug APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@v5
      - name: Require SMS Massa branch
        run: test "${GITHUB_REF_NAME}" = "codex/sms-massa"
      - uses: actions/setup-node@v5
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx cap sync android
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '21' }
      - name: Build debug APK
        shell: bash
        run: |
          chmod +x android/gradlew
          android/gradlew -p android --no-daemon --max-workers=2 testDebugUnitTest compileDebugKotlin compileDebugJavaWithJavac assembleDebug
      - name: Verify debug identity
        shell: bash
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          AAPT=$(find "${ANDROID_HOME}/build-tools" -type f -name aapt | sort | tail -n1)
          test -f "${APK}"
          "${AAPT}" dump badging "${APK}" | grep -E "package: name='br.com.smsmassa.app' versionCode='6' versionName='1.4.0'"
          "${AAPT}" dump badging "${APK}" | grep -F "application-label:'SMS Massa'"
          echo "Commit incorporado: ${GITHUB_SHA}"
      - uses: actions/upload-artifact@v4
        with:
          name: sms-massa-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
