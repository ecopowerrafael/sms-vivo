name: Android source compile

on:
  push:
    branches: [codex/refactor-mobile-ui, codex/stage2-robustness]
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx cap sync android
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile Android sources only
        run: |
          chmod +x android/gradlew
          android/gradlew -p android --no-daemon --max-workers=2 testDebugUnitTest compileDebugKotlin compileDebugJavaWithJavac compileDebugAndroidTestKotlin compileDebugAndroidTestJavaWithJavac assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: sms-vivo-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
