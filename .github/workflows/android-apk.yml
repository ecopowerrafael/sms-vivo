name: Android APK
on:
  workflow_dispatch:
    inputs:
      build_release:
        description: Build the signed release APK from codex/stage2-robustness
        required: false
        type: boolean
        default: true
jobs:
  build:
    runs-on: ubuntu-latest
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@v5
      - name: Require homologation branch
        run: test "${GITHUB_REF_NAME}" = "codex/stage2-robustness"
      - uses: actions/setup-node@v5
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx cap sync android
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '21' }
      - name: Prepare release keystore and validate secrets
        if: ${{ inputs.build_release }}
        shell: bash
        run: |
          test -n "${ANDROID_KEYSTORE_BASE64}" || { echo "ANDROID_KEYSTORE_BASE64 is required for a release build"; exit 1; }
          test -n "${ANDROID_KEYSTORE_PASSWORD}" || { echo "ANDROID_KEYSTORE_PASSWORD is required for a release build"; exit 1; }
          test -n "${ANDROID_KEY_ALIAS}" || { echo "ANDROID_KEY_ALIAS is required for a release build"; exit 1; }
          test -n "${ANDROID_KEY_PASSWORD}" || { echo "ANDROID_KEY_PASSWORD is required for a release build"; exit 1; }
          echo "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > android/release.keystore
          test -s android/release.keystore
          keytool -list -keystore android/release.keystore -storepass "${ANDROID_KEYSTORE_PASSWORD}" -alias "${ANDROID_KEY_ALIAS}" >/dev/null
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - name: Build signed release APK
        if: ${{ inputs.build_release }}
        run: |
          export SMS_VIVO_BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          export SMS_VIVO_COMMIT="${GITHUB_SHA}"
          chmod +x android/gradlew
          android/gradlew -p android assembleRelease
        env:
          SMS_VIVO_KEYSTORE_PATH: ${{ github.workspace }}/android/release.keystore
          SMS_VIVO_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SMS_VIVO_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SMS_VIVO_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - name: Verify release identity and signature
        if: ${{ inputs.build_release }}
        shell: bash
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          AAPT=$(find "${ANDROID_HOME}/build-tools" -type f -name aapt | sort | tail -n1)
          APKSIGNER=$(find "${ANDROID_HOME}/build-tools" -type f -name apksigner | sort | tail -n1)
          test -f "${APK}"
          test -x "${AAPT}"
          test -x "${APKSIGNER}"
          "${AAPT}" dump badging "${APK}" | grep -E "package: name='br.com.smsvivo.app' versionCode='3' versionName='1.1.0'"
          "${APKSIGNER}" verify --verbose --print-certs "${APK}"
      - name: Upload signed release APK
        if: ${{ inputs.build_release }}
        uses: actions/upload-artifact@v4
        with:
          name: sms-vivo-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
