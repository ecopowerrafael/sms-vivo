name: Android source compile

on:
  push:
    branches: [codex/refactor-mobile-ui, codex/stage2-robustness]
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx cap sync android
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Compile Android sources only
        run: |
          chmod +x android/gradlew
          android/gradlew -p android --no-daemon --max-workers=2 compileDebugKotlin compileDebugJavaWithJavac
